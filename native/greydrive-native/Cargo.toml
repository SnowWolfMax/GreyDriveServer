[package]
name = "greydrive-native"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "greydrive_native"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
